server:
  port: 8080

spring:
  application:
    name: evaluator-backend
  datasource:
    url: jdbc:h2:mem:presentation_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  sql:
    init:
      mode: always
  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  mail:
    host: ${EMAIL_HOST:smtp.gmail.com}
    port: ${EMAIL_PORT:587}
    username: ${EMAIL_USER:thupakulakulayappa24@gmail.com}
    password: ${EMAIL_PASSWORD:blxwhvqotlyrthbr}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          ssl:
            trust: smtp.gmail.com
            protocols: TLSv1.2

logging:
  level:
    com.presentation.evaluator: DEBUG
    org.hibernate.SQL: DEBUG
