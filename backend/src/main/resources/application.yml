server:
  port: ${PORT:8080}

spring:
  application:
    name: evaluator-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:presentation_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  h2:
    console:
      enabled: true
      path: /h2-console
  sql:
    init:
      mode: always
  jpa:
    open-in-view: false
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  mail:
    host: ${EMAIL_HOST:smtp.gmail.com}
    port: ${EMAIL_PORT:587}
    username: ${EMAIL_USER:presentationevaluator2@gmail.com}
    password: ${EMAIL_PASSWORD:oqifftiejiinklwd}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          ssl:
            trust: smtp.gmail.com
            protocols: TLSv1.2

logging:
  level:
    com.presentation.evaluator: DEBUG
    org.hibernate.SQL: DEBUG

resend:
  api-key: ${RESEND_API_KEY:}
